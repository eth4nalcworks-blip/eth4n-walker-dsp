<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SOW — SIREN Lite</title>
<meta name="description" content="SIREN Lite: play Walker dsp SIREN's oscillator, PRISM, ENV1 and LFO1 in the browser.">
<style>
  :root {
    --bg: #070809; --field: #0b0c10; --panel: #14161c; --panelhi: #1b1e27; --grid: #23262e;
    --ink: #e8eaf0; --dim: #696f7c; --accent: #45e0d2; --accentdim: #2a8a82; --edge: #333845;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); }
  body { font: 12px/1.4 Arial, "Helvetica Neue", Helvetica, sans-serif; min-height: 100vh;
         display: flex; flex-direction: column; align-items: center; padding: 12px 16px 20px; }
  header { width: 100%; max-width: 1920px; display: flex; align-items: baseline; gap: 12px;
           padding: 0 0 10px; color: var(--dim); letter-spacing: .08em; font-size: 11px; }
  header b { color: var(--ink); letter-spacing: .14em; font-size: 12px; }
  header .sp { flex: 1; }
  #stage-wrap { position: relative; overflow: hidden; border-radius: 6px;
                box-shadow: 0 0 0 1px #1c1f27, 0 18px 50px rgba(0,0,0,.55); }
  #stage { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  #editor { display: block; touch-action: none; user-select: none; -webkit-user-select: none; }
  #dom-layer { position: absolute; inset: 0; pointer-events: none; }
  #dom-layer > * { pointer-events: auto; }
  .sow-textedit { position: absolute; margin: 0; padding: 0 1px; border: 1px solid var(--edge); border-radius: 3px;
                  background: #0f1116; color: var(--ink); outline: none; caret-color: var(--accent); }

  #start { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
           gap: 14px; background: rgba(5,6,8,.62); backdrop-filter: blur(1.5px); cursor: pointer; z-index: 5;
           transition: opacity .25s; }
  #start.hidden { opacity: 0; pointer-events: none; }
  #start .btn { font: bold 13px Arial, sans-serif; letter-spacing: .18em; color: var(--field); background: var(--accent);
                border: 0; border-radius: 4px; padding: 12px 26px; cursor: pointer; }
  #start .msg { color: var(--dim); font-size: 12px; letter-spacing: .06em; text-align: center; padding: 0 16px; }

  /* playing surface */
  .kb { display: flex; gap: 8px; height: 112px; margin-top: 10px; padding: 8px; background: var(--panel);
        border: 1px solid #1c1f27; border-radius: 6px; user-select: none; -webkit-user-select: none; }
  .kb-side { display: flex; gap: 6px; align-items: stretch; }
  .kb-strip { display: flex; flex-direction: column; align-items: center; gap: 4px; width: 28px; }
  .kb-track { position: relative; flex: 1; width: 16px; background: var(--field); border: 1px solid var(--edge);
              border-radius: 3px; touch-action: none; cursor: ns-resize; }
  .kb-fill { position: absolute; left: 2px; right: 2px; background: var(--accentdim); border-radius: 1px; }
  .kb-thumb { position: absolute; left: -3px; right: -3px; height: 10px; background: var(--ink); border-radius: 2px; }
  .kb-label { font-size: 8px; color: var(--dim); letter-spacing: .08em; }
  .kb-keys { position: relative; flex: 1; touch-action: none; cursor: pointer; }
  .key { position: absolute; top: 0; }
  .key.white { height: 100%; background: #d9dce3; border: 1px solid #0b0c10; border-radius: 0 0 3px 3px; }
  .key.white span { position: absolute; bottom: 4px; left: 0; right: 0; text-align: center; font-size: 8px; color: #5a606c; pointer-events: none; }
  .key.black { height: 60%; background: #15171d; border: 1px solid #000; border-radius: 0 0 2px 2px; z-index: 1; }
  .key.white.on { background: var(--accent); }
  .key.black.on { background: var(--accentdim); }
  .kb-info { flex-direction: column; justify-content: space-between; align-items: flex-end; width: 120px; }
  .kb-text { color: var(--dim); font-size: 9px; text-align: right; line-height: 1.6; }
  .kb-text b { color: var(--ink); font-weight: bold; }
  .kb-btn { font: bold 9px Arial, sans-serif; letter-spacing: .1em; color: var(--ink); background: var(--panelhi);
            border: 1px solid var(--accentdim); border-radius: 0; padding: 6px 10px; cursor: pointer; }
  .kb-btn.on { background: var(--accentdim); }
  /* inside the site's SOW tab: the frame is a dark tile, the parent sizes it */
  html.embed body { min-height: 0; padding: 0; background: #0d0d0d; }
  html.embed header { display: none; }
  html.embed #stage-wrap { box-shadow: none; border-radius: 4px; }
  html.embed .kb { border-color: #1f1f1f; }
  @media (max-width: 700px) {
    .kb { height: 90px; }
    .kb-info { display: none; }
    #start .msg { display: none; }
    #start .btn { padding: 8px 18px; font-size: 11px; }
  }
</style>
</head>
<body>
<header><b>SOW</b><span>SIREN LITE</span><span class="sp"></span><span>Walker dsp</span></header>
<div id="stage-wrap">
  <div id="stage">
    <canvas id="editor"></canvas>
    <div id="dom-layer"></div>
  </div>
  <div id="start">
    <button class="btn" type="button">START AUDIO</button>
    <div class="msg">クリックで音が出ます ・ 下の鍵盤かキーボード（A〜;）で演奏</div>
  </div>
</div>
<div id="keyboard"></div>
<script type="module" src="js/app.js"></script>
</body>
</html>
