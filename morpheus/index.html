<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MORPHEUS — Walker dsp</title>
<meta name="description" content="MORPHEUS: roll a wavetable, play it, download the WAV.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Geist+Mono:wght@400..500&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* The site's own world (eth4n-site/index.html): a black plate carrying orange
   and two greys, hairlines, pills, Geist with Geist Mono labels. Three things
   on it: the table, two buttons, a keyboard. */
:root {
  --orange: #ff6b1a;
  --ink: #0d0d0d;
  --panel: #1a1a1a;
  --line: #262626;
  --line-hi: #3a3a3a;
  --dim: #7a7a7a;
  --fg: #d9d9d9;
  --r-md: 16px;
  --sans: "Geist", "Zen Kaku Gothic New", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, system-ui, sans-serif;
  --mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box }
html, body { margin: 0; background: var(--ink); color: var(--fg) }
body { font: 14px/1.5 var(--sans); -webkit-font-smoothing: antialiased; padding: 16px }
button { font: inherit; color: inherit }
[hidden] { display: none !important }
::selection { background: var(--orange); color: var(--ink) }
:focus-visible { outline: 2px solid var(--orange); outline-offset: 3px }

.mx { max-width: 1240px; margin: 0 auto; display: grid; gap: 14px }
.label { font: 500 10px/1.4 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--dim) }

/* full-screen page title (the site has its own) */
.top { display: flex; align-items: baseline; gap: 14px; padding: 4px 2px 6px }
.top b { font: 600 22px/1 var(--sans); letter-spacing: -.02em; color: var(--orange) }
html.embed body { padding: 0 }
html.embed .top { display: none }

.stage { background: var(--panel); border-radius: var(--r-md); padding: 16px 18px 14px }
.stage .head { display: flex; justify-content: space-between; gap: 12px; margin-bottom: 6px }
.stage .head .val { color: var(--fg) }
#table { display: block; width: 100%; height: clamp(220px, 34vw, 400px) }

.actions { display: flex; flex-wrap: wrap; align-items: center; gap: 10px }
.actions .sp { flex: 1 }
.pill {
  display: inline-flex; align-items: center; gap: 10px; height: 48px; padding: 0 24px;
  border: 1px solid var(--line-hi); border-radius: 999px; background: transparent;
  font: 500 12px/1 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--fg);
  cursor: pointer; white-space: nowrap; transition: background .15s, border-color .15s, color .15s;
}
.pill:hover { border-color: var(--fg) }
.pill:disabled { opacity: .4; cursor: default }
.pill.solid { background: var(--orange); border-color: var(--orange); color: var(--ink) }
.pill.solid:hover { background: #ff7f3a; border-color: #ff7f3a }
.pill.small { height: 30px; padding: 0 14px; font-size: 10px }
.pill[aria-pressed="true"] { border-color: var(--orange); color: var(--orange) }

.kb { display: grid; gap: 8px }
.keys { position: relative; height: 96px; touch-action: none; user-select: none; -webkit-user-select: none }
.key { position: absolute; top: 0; border-radius: 0 0 6px 6px }
.key.white { height: 100%; background: var(--fg); border: 1px solid var(--ink) }
.key.black { height: 58%; background: #050505; border: 1px solid var(--ink); z-index: 1 }
.key.white.on { background: var(--orange) }
.key.black.on { background: #b84a0f }
.key span { position: absolute; bottom: 6px; left: 0; right: 0; text-align: center; font: 500 9px/1 var(--mono); color: #6a6a6a; pointer-events: none }
.kb-foot { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px }
.kb-foot b { color: var(--fg); font-weight: 500 }

.status { min-height: 16px; margin: 0 2px; font: 400 11px/1.5 var(--mono); color: var(--dim) }
.status.warn { color: var(--orange) }

#start { position: fixed; inset: 0; z-index: 20; display: grid; place-content: center; padding: 20px; background: rgba(13,13,13,.7) }
#start .msg { font: 400 12px/1.6 var(--mono); color: var(--fg); text-align: center }
html.embed #start { position: absolute }

@media (max-width: 560px) {
  body { padding: 10px }
  .stage { padding: 12px }
  .actions .pill { height: 44px; padding: 0 18px; flex: 1; justify-content: center }
  .actions .sp { display: none }
  .kb-hint { display: none }
}
@media (prefers-reduced-motion: reduce) { .pill { transition: none } }
</style>
</head>
<body>
<main class="mx">
  <div class="top"><b>MORPHEUS</b><span class="label">Wavetable generator — Walker dsp</span></div>

  <section class="stage">
    <div class="head label"><span>Wavetable</span><span class="val" id="info"></span></div>
    <canvas id="table" role="img" aria-label="今のウェーブテーブル"></canvas>
  </section>

  <div class="actions">
    <button class="pill" id="random" type="button">Random ↻</button>
    <span class="sp"></span>
    <button class="pill solid" id="download" type="button">Download WAV ↓</button>
  </div>

  <section class="kb" aria-label="試聴">
    <div class="keys" id="keys"></div>
    <div class="kb-foot">
      <span class="label kb-hint"><b>F〜;</b> white · <b>T Y I O P</b> black · <b>Z X</b> octave</span>
      <button class="pill small" id="midi" type="button">MIDI</button>
    </div>
  </section>

  <p class="status" id="status" role="status"></p>
</main>

<!-- only shown when the page cannot start (app.js showFailure); the audio itself
     starts on the first note, which is the gesture it needs -->
<div id="start" hidden><div class="msg"></div></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
